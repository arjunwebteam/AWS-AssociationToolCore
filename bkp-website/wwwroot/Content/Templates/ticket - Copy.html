<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pongal Celebration Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&family=Audiowide&display=swap');

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .ticket-container {
            width: 800px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #490921 0%, #290921 100%);
            border-radius: 15px;
            padding: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: white;
            overflow: hidden;
        }

        .ticket-main {
            width: 100%;
            border-collapse: collapse;
            padding: 30px;
        }

        .logo-section {
            width: 40%;
            vertical-align: top;
            padding: 30px 20px;
            text-align: center;
        }

        .event-section {
            width: 60%;
            vertical-align: top;
            padding: 30px 20px;
            text-align: center;
        }

        .logo-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #fff;
            margin: 0 auto 20px auto;
            display: block;
        }

        .org-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            margin: 15px 0 5px 0;
            text-transform: uppercase;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .org-subtitle {
            font-size: 12px;
            color: #ffffff;
            margin: 5px 0 20px 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .presents-text {
            font-size: 14px;
            color: #ffffff;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .pongal-title {
            font-size: 48px;
            color: #ffd700;
            margin: 10px 0;
            font-family: 'Great Vibes', cursive;
            font-weight: bold;
        }

        .celebrations-title {
            font-size: 36px;
            color: #ffd700;
            margin: 0 0 20px 0;
            font-family: 'Great Vibes', cursive;
            font-weight: bold;
        }

        .sponsors-ticket {
            font-size: 14px;
            color: #f1d2c0;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .happy-pongal {
            font-size: 32px;
            color: #ffeb3b;
            margin: 10px 0 20px 0;
            font-weight: bold;
            font-family: 'Audiowide', Arial, sans-serif;
        }

        .date-location-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .date-cell {
            width: 50%;
            vertical-align: top;
            padding: 0 10px;
            border-right: 3px solid #601631;
        }

        .location-cell {
            width: 50%;
            vertical-align: top;
            padding: 0 10px;
        }

        .date-month {
            font-size: 16px;
            color: #f1d2c0;
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .date-year {
            font-size: 16px;
            color: #f1d2c0;
            margin: 5px 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .date-day {
            font-size: 40px;
            color: #ffeb3b;
            margin: 10px 0;
            font-weight: bold;
            font-family: 'Audiowide', Arial, sans-serif;
        }

        .date-sup {
            font-size: 16px;
            vertical-align: super;
            font-family: 'Audiowide', Arial, sans-serif;
        }

        .date-time {
            font-size: 16px;
            color: #f1d2c0;
            margin: 10px 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .location-title {
            font-size: 14px;
            color: #ffffff;
            margin: 0 0 10px 0;
            font-weight: bold;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .location-details {
            font-size: 14px;
            color: #f1d2c0;
            line-height: 1.4;
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .sponsor-details-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .sponsor-left {
            width: 60%;
            vertical-align: top;
            padding: 0 10px;
        }

        .barcode-right {
            width: 40%;
            vertical-align: top;
            padding: 0 10px;
            text-align: center;
        }

        .sponsor-name-section {
            margin-bottom: 15px;
        }

        .sponsor-name-title {
            font-size: 12px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .sponsor-name-box {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .sponsor-bottom-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sponsor-category-cell {
            width: 70%;
            vertical-align: top;
            padding-right: 10px;
        }

        .ticket-number-cell {
            width: 30%;
            vertical-align: top;
        }

        .sponsor-category-title {
            font-size: 12px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .sponsor-category-box {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .ticket-number-title {
            font-size: 12px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .ticket-number-box {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .qrcode-title {
            font-size: 12px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .qrcode-box {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .qrcode-img {
            width: 100px;
            height: 100px;
            background-color: #000;
            margin: 0 auto;
            background-image: linear-gradient(90deg, #fff 0px, #fff 10px, #000 10px, #000 20px, #fff 20px, #fff 30px, #000 30px, #000 40px, #fff 40px, #fff 50px, #000 50px, #000 60px, #fff 60px, #fff 70px, #000 70px, #000 80px, #fff 80px, #fff 90px, #000 90px, #000 100px), linear-gradient(0deg, #fff 0px, #fff 10px, #000 10px, #000 20px, #fff 20px, #fff 30px, #000 30px, #000 40px, #fff 40px, #fff 50px, #000 50px, #000 60px, #fff 60px, #fff 70px, #000 70px, #000 80px, #fff 80px, #fff 90px, #000 90px, #000 100px);
            border: 2px solid #000;
        }
    </style>
</head>
<body>
    <div class="ticket-container">
        <table class="ticket-main">
            <tr>
                <!-- Left Section: Logo and Organization -->
                <td class="logo-section">
                    <div class="logo-img"></div>
                    <div class="org-title">[SiteName]</div>
                    <div class="org-subtitle">[CompanyAddress]</div>
                    <div class="presents-text">Proudly Presents</div>
                    <div class="pongal-title">Pongal</div>
                    <div class="celebrations-title">Celebrations</div>
                </td>

                <!-- Right Section: Event Details -->
                <td class="event-section">
                    <div class="sponsors-ticket">Sponsors Ticket</div>
                    <div class="happy-pongal">[EventName]</div>

                    <!-- Date and Location Table -->
                    <table class="date-location-table">
                        <tr>
                            <td class="date-cell">
                                <div class="date-month">[MONTH]</div>
                                <div class="date-year">[YEAR]</div>
                                <div class="date-day">[DAY]<span class="date-sup">[DAY_SUFFIX]</span></div>
                                <div class="date-time">at [TIME]</div>
                            </td>
                            <td class="location-cell">
                                <div class="location-title">Event Location:</div>
                                <div class="location-details">
                                    [Location]
                                </div>
                            </td>
                        </tr>
                    </table>

                    <!-- Sponsor Details Table -->
                    <table class="sponsor-details-table">
                        <tr>
                            <td class="sponsor-left">
                                <!-- Sponsor Name -->
                                <div class="sponsor-name-section">
                                    <div class="sponsor-name-title">Sponsor Name</div>
                                    <div class="sponsor-name-box">[SPONSOR_NAME]</div>
                                </div>

                                <!-- Category and Ticket Number -->
                                <table class="sponsor-bottom-table">
                                    <tr>
                                        <td class="sponsor-category-cell">
                                            <div class="sponsor-category-title">Sponsor Category</div>
                                            <div class="sponsor-category-box">[CATEGORY]</div>
                                        </td>
                                        <td class="ticket-number-cell">
                                            <div class="ticket-number-title">Ticket #</div>
                                            <div class="ticket-number-box">[TICKET_NUMBER]</div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                            <td class="barcode-right">
                                <div class="qrcode-title">Ticket QR Code</div>
                                <div class="qrcode-box">
                                    <div class="qrcode-img">[QRCode]</div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
