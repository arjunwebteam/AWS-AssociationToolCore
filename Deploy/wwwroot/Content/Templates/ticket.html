<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pongal Celebration Ticket</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .ticket-container {
            width: 800px;
            margin: 0 auto;
            background-color: #490921;
            border: 2px solid #290921;
            padding: 30px;
            color: white;
        }

        .ticket-table {
            width: 100%;
            border-collapse: collapse;
        }

        .logo-cell {
            width: 40%;
            vertical-align: top;
            text-align: center;
            padding-right: 20px;
        }

        .content-cell {
            width: 60%;
            vertical-align: top;
            padding-left: 20px;
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            background-color: #fff;
            border: 2px solid #000;
            margin: 0 auto 15px auto;
            text-align: center;
            line-height: 120px;
            color: #000;
            font-size: 12px;
        }

        .org-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffeb3b;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .org-subtitle {
            font-size: 11px;
            color: #ffffff;
            margin: 5px 0 15px 0;
        }

        .presents {
            font-size: 12px;
            color: #ffffff;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
        }

        .event-title {
            font-size: 28px;
            color: #ffd700;
            margin: 10px 0;
            font-weight: bold;
            font-style: italic;
        }

        .sponsors-header {
            font-size: 12px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .main-title {
            font-size: 24px;
            color: #ffeb3b;
            margin: 8px 0 15px 0;
            font-weight: bold;
        }

        .date-location-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .date-cell {
            width: 45%;
            vertical-align: top;
            border-right: 3px solid #601631;
            padding-right: 15px;
            text-align: center;
        }

        .location-cell {
            width: 55%;
            vertical-align: top;
            padding-left: 15px;
        }

        .date-month {
            font-size: 14px;
            color: #f1d2c0;
            margin: 0;
        }

        .date-year {
            font-size: 14px;
            color: #f1d2c0;
            margin: 2px 0;
        }

        .date-day {
            font-size: 32px;
            color: #ffeb3b;
            margin: 8px 0;
            font-weight: bold;
        }

        .date-time {
            font-size: 14px;
            color: #f1d2c0;
            margin: 8px 0;
        }

        .location-title {
            font-size: 12px;
            color: #ffffff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .location-text {
            font-size: 12px;
            color: #f1d2c0;
            line-height: 1.3;
        }

        .sponsor-info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .sponsor-details-cell {
            width: 65%;
            vertical-align: top;
            padding-right: 15px;
        }

        .qr-cell {
            width: 35%;
            vertical-align: top;
            text-align: center;
        }

        .info-row {
            margin-bottom: 12px;
        }

        .info-label {
            font-size: 10px;
            color: #f1d2c0;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .info-box {
            background-color: #ffffff;
            color: #000000;
            padding: 8px 12px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .inline-table {
            width: 100%;
            border-collapse: collapse;
        }

        .category-cell {
            width: 65%;
            padding-right: 8px;
        }

        .ticket-num-cell {
            width: 35%;
        }

        .qr-label {
            font-size: 10px;
            color: #f1d2c0;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        .qr-container {
            background-color: #ffffff;
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .qr-placeholder {
            width: 80px;
            height: 80px;
            background-color: #000;
            margin: 0 auto;
            border: 1px solid #000;
            position: relative;
        }

        .qr-pattern {
            width: 100%;
            height: 100%;
            background-image: linear-gradient(90deg, #fff 0px, #fff 8px, #000 8px, #000 16px, #fff 16px, #fff 24px, #000 24px, #000 32px, #fff 32px, #fff 40px, #000 40px, #000 48px, #fff 48px, #fff 56px, #000 56px, #000 64px, #fff 64px, #fff 72px, #000 72px, #000 80px), linear-gradient(0deg, #fff 0px, #fff 8px, #000 8px, #000 16px, #fff 16px, #fff 24px, #000 24px, #000 32px, #fff 32px, #fff 40px, #000 40px, #000 48px, #fff 48px, #fff 56px, #000 56px, #000 64px, #fff 64px, #fff 72px, #000 72px, #000 80px);
        }
    </style>
</head>
<body>
    <div class="ticket-container">
        <table class="ticket-table">
            <tr>
                <!-- Left Section: Logo and Organization -->
                <td class="logo-section">
                    <div class="logo-img"></div>
                    <div class="org-title">[SiteName]</div>
                    <div class="org-subtitle">[CompanyAddress]</div>
                    <div class="presents-text">Proudly Presents</div>
                    <div class="pongal-title">Pongal</div>
                    <div class="celebrations-title">Celebrations</div>
                </td>

                <!-- Right Section: Event Details -->
                <td class="event-section">
                    <div class="sponsors-ticket">Sponsors Ticket</div>
                    <div class="happy-pongal">[EventName]</div>

                    <!-- Date and Location Table -->
                    <table class="date-location-table">
                        <tr>
                            <td class="date-cell">
                                <div class="date-month">[MONTH]</div>
                                <div class="date-year">[YEAR]</div>
                                <div class="date-day">[DAY]<span class="date-sup">[DAY_SUFFIX]</span></div>
                                <div class="date-time">at [TIME]</div>
                            </td>
                            <td class="location-cell">
                                <div class="location-title">Event Location:</div>
                                <div class="location-details">
                                    [Location]
                                </div>
                            </td>
                        </tr>
                    </table>

                    <!-- Sponsor Details Table -->
                    <table class="sponsor-details-table">
                        <tr>
                            <td class="sponsor-left">
                                <!-- Sponsor Name -->
                                <div class="sponsor-name-section">
                                    <div class="sponsor-name-title">Sponsor Name</div>
                                    <div class="sponsor-name-box">[SPONSOR_NAME]</div>
                                </div>

                                <!-- Category and Ticket Number -->
                                <table class="sponsor-bottom-table">
                                    <tr>
                                        <td class="sponsor-category-cell">
                                            <div class="sponsor-category-title">Sponsor Category</div>
                                            <div class="sponsor-category-box">[CATEGORY]</div>
                                        </td>
                                        <td class="ticket-number-cell">
                                            <div class="ticket-number-title">Ticket #</div>
                                            <div class="ticket-number-box">[TICKET_NUMBER]</div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                            <td class="barcode-right">
                                <div class="qrcode-title">Ticket QR Code</div>
                                <div class="qrcode-box">
                                    <div class="qrcode-img">[QRCode]</div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
